name: CI/CD Pipeline - Confidential Product Warranty Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  contract-verification-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Compact Contract Compilation & Verification
        run: npm run compile:compact

      - name: Run Midnight Contract Tests (Vitest)
        run: npm test

      - name: Build Next.js Application
        run: npm run build

      - name: Validate Authoritative Deployment Record
        run: |
          echo "=== Midnight Preview Deployment Record ==="
          echo "Network: Midnight Preview Testnet"
          echo "Contract Address: 0x39764195d14758b6bd52ab6e13a0547bd29e972be5bfa4c18f2ceafc504ddc1a"
          echo "Explorer: https://preview.midnightexplorer.com/contracts/0x39764195d14758b6bd52ab6e13a0547bd29e972be5bfa4c18f2ceafc504ddc1a"
          echo "Circuits: claimWarranty, verifyWarranty, revokeWarranty, setManufacturerCommitment, resetProduct, incrementSession"
          echo "Ledger: 8 fields (claimCount, revokedCount, activeSession, productId, manufacturerCommitment, lastClaimCommitment, lastRevokedCommitment, minimumRequiredDays)"
          echo "CI/CD checks passed successfully."
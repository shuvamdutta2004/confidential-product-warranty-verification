name: CI/CD Pipeline — Confidential Product Warranty Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Compact Contract Source
        run: |
          echo "=== Compact Contract Source (confidential_product_warranty.compact) ==="
          cat contracts/confidential_product_warranty.compact
          echo ""
          echo "=== Compact Contract Source (counter.compact) ==="
          cat contracts/counter.compact
          echo ""
          echo "? Compact contract source verified. Full compilation requires Midnight Compact SDK."
          echo "?? Managed output (pre-compiled) verified in managed/contract/"
          ls -la managed/contract/

      - name: Verify Managed Contract Output
        run: |
          echo "=== Managed Contract Type Definitions ==="
          cat managed/contract/index.d.ts
          echo ""
          echo "? Managed contract artifacts present (index.js + index.d.ts)"

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Build Next.js Web Platform
        run: npm run build

